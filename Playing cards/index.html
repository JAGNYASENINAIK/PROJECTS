<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card red">
      <div class="left">
        <span>A</span>
        <span>♥</span>
      </div>
      <div class="middle">♥</div>
      <div class="right">
        <span>♥</span>
        <span>A</span>
      </div>
    </div>

    <div class="card black">
      <div class="left">
        <span>K</span>
        <span>♠</span>
      </div>
      <div class="middle">♠</div>
      <div class="right">
        <span>♠</span>
        <span>K</span>
      </div>
    </div>

    <div class="card red">
      <div class="left">
        <span>Q</span>
        <span>♦</span>
      </div>
      <div class="middle">♦</div>
      <div class="right">
        <span>♦</span>
        <span>Q</span>
      </div>
    </div>

    <div class="card black">
      <div class="left">
        <span>J</span>
        <span>♣</span>
      </div>
      <div class="middle">♣</div>
      <div class="right">
        <span>♣</span>
        <span>J</span>
      </div>
    </div>

    <div class="card red">
      <div class="left">
        <span>10</span>
        <span>♥</span>
      </div>
      <div class="middle">♥</div>
      <div class="right">
        <span>♥</span>
        <span>10</span>
      </div>
    </div>
  </main>
</body>
</html>
