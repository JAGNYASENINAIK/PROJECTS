<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
        crossorigin="anonymous">
  <title>TODOs List</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="#">TODOs List</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse"
          data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
          aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
</nav>

<div class="container my-4">
  <h2 class="text-center">TODOs List</h2>

  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" class="form-control" id="title" placeholder="Enter title">
    <small class="form-text text-muted">Add an item to the list</small>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea class="form-control" id="description" rows="3" placeholder="Enter description"></textarea>
  </div>

  <button type="submit" id="add" class="btn btn-primary">Add to list</button>

  <div id="items" class="my-4">
    <h2>Your Items</h2>
    <table class="table">
      <thead>
      <tr>
        <th scope="col">SNo</th>
        <th scope="col">Item Title</th>
        <th scope="col">Item Description</th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>

<script>
  // Load and render stored items
  function update() {
    const tableBody = document.getElementById("tableBody");
    let itemJsonArray = JSON.parse(localStorage.getItem("itemJson")) || [];
    let str = "";

    itemJsonArray.forEach((element, index) => {
      str += `
        <tr>
          <th scope="row">${index + 1}</th>
          <td>${element[0]}</td>
          <td>${element[1]}</td>
          <td><button class="btn btn-danger btn-sm" onclick="deleted(${index})">Delete</button></td>
        </tr>
      `;
    });

    tableBody.innerHTML = str;
  }

  // Add new item
  document.getElementById("add").addEventListener("click", () => {
    const tit = document.getElementById('title').value.trim();
    const desc = document.getElementById('description').value.trim();

    if (!tit || !desc) {
      alert("Please enter both title and description.");
      return;
    }

    let itemJsonArray = JSON.parse(localStorage.getItem("itemJson")) || [];
    itemJsonArray.push([tit, desc]);
    localStorage.setItem("itemJson", JSON.stringify(itemJsonArray));

    document.getElementById('title').value = "";
    document.getElementById('description').value = "";
    update();
  });

  // Delete item by index
  function deleted(index) {
    let itemJsonArray = JSON.parse(localStorage.getItem("itemJson")) || [];
    itemJsonArray.splice(index, 1);
    localStorage.setItem("itemJson", JSON.stringify(itemJsonArray));
    update();
  }

  // Initialize table on load
  document.addEventListener("DOMContentLoaded", update);
</script>

</body>
</html>
